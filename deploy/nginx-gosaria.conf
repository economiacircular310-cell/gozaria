# Nginx para la web de Gosaria. Certbot añade el bloque HTTPS automáticamente.
server {
    listen 80;
    listen [::]:80;
    server_name __DOMINIO__;

    server_tokens off;
    client_max_body_size 1m;

    # Demo privada (opcional): pedir usuario y contraseña. Para activarla:
    #   sudo apt install apache2-utils && sudo htpasswd -c /etc/nginx/gosaria.htpasswd cliente
    # y quita el # de las dos líneas siguientes; después: sudo systemctl reload nginx
    # auth_basic "Demo Gosaria";
    # auth_basic_user_file /etc/nginx/gosaria.htpasswd;

    gzip on;
    gzip_vary on;
    gzip_min_length 500;
    gzip_types text/css application/javascript image/svg+xml application/json application/xml text/plain application/manifest+json;

    # Archivos estáticos servidos directamente por Nginx (fotos, tipografía, JS, CSS)
    location /static/ {
        alias __DESTINO__/gosaria/static/;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        access_log off;
    }

    location = /favicon.ico {
        alias __DESTINO__/gosaria/static/favicon.ico;
        expires 30d;
        access_log off;
    }

    location / {
        proxy_pass http://127.0.0.1:__PUERTO__;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_read_timeout 30s;
    }
}
